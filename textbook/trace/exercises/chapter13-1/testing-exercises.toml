title = "Pointer Reassignment"
difficulty = "Easy"
table = false
multipart = false
type = "multiple-choice"

question = '''
After executing the following code, what is the value of `temp->data`?

```{code-block} c
Node *head = (Node *)malloc(sizeof(Node));
head->data = 1;

head->next = (Node *)malloc(sizeof(Node));
head->next->data = 2;
head->next->next = NULL;

Node* temp = head->next;
```
'''

answer = [1]

choices = [
  "1",
  "2",
  "0",
  "Runtime error"
]
