type = "visualizer"

question = '''
What happens after executing the following code?

```{code-block} c
Node *head = createNode(1);
head = createNode(2);
```

A. The list becomes `1 -> 2`

B. Only node 2 is accessible

C. Both nodes are connected

D. The program crashes
'''

answer = '''
B
'''
