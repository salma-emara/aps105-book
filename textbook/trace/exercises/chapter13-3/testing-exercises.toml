[[exercises]]
question-id = "chapter13-insert-q1"
title = "Counting Loop Iterations"
difficulty = "Easy"
table = false
multipart = false
type = "multiple-choice"

question = '''
Suppose `head` points to the following linked list:

`1 -> 2 -> 3 -> 4 -> 5`

How many times does the loop body execute?

```{code-block} c
Node *current = head;

while (current != NULL) {
  if (current->data == 3) {
    current = current->next;
  }
  current = current->next;
}
```
'''

answer = [1]

choices = [
  "3",
  "4",
  "5",
  "6"
]
