[[exercises]]
question-id = "visualizer-DF-BEHAVIOR2"
title = "Order Matters in deleteFront"
difficulty = "Easy"
table = false
multipart = false
type = "visualizer"

question = '''
Why must we store `list->head->next` before calling `free(list->head)`?

```{code-block} c
Node *newHead = list->head->next;
free(list->head);
list->head = newHead;
```

A. Because `free(list->head)` will remove access to the original head pointer itself

B. Because after freeing the head, we cannot safely access its `next` pointer

C. Because `newHead` must always be assigned before updating `list->head`

D. Because freeing memory automatically deletes all remaining nodes
'''

answer = '''
B
'''
